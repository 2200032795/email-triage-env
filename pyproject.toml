[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-env"
version = "1.0.0"
description = "Email Triage OpenEnv Environment"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "openenv-core",
]

[project.scripts]
serve = "uvicorn.main:main"

[tool.openenv]
name = "email-triage-env"
version = "1.0.0"
entry_point = "server:app"
[tool.setuptools]
py-modules = []